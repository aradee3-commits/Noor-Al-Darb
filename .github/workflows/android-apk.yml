name: Build Noor Al-Darb APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Noor-Al-Darb-Android-Source-for-GitHub.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q Noor-Al-Darb-Android-Source-for-GitHub.zip -d project
          find project -name build.gradle.kts -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Darb-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
