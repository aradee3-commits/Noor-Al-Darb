name: Build Noor Al-Darb APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Noor-Al-Darb-Android-Source-for-GitHub.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q Noor-Al-Darb-Android-Source-for-GitHub.zip -d project

      - name: Upload extracted source for review
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Darb-extracted-source
          path: project/
          if-no-files-found: error
          retention-days: 7

      - name: Fix Java and Kotlin targets
        run: |
          APP_GRADLE=$(find project -path '*/app/build.gradle.kts' -print -quit)
          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          marker = '    buildFeatures { compose = true }'
          patch = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

          '''

          if marker not in s:
              raise SystemExit("Could not find buildFeatures in app/build.gradle.kts")

          if 'jvmTarget = "17"' not in s:
              s = s.replace(marker, patch + marker, 1)

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Darb-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
