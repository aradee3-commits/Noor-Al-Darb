
name: Build Noor Al-Darb APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Noor-Al-Darb-Android-Source-for-GitHub.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q Noor-Al-Darb-Android-Source-for-GitHub.zip -d project
          echo "Project files:"
          find project -maxdepth 5 -type f | sort | head -200

      - name: Build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper (gradlew) was not found in the ZIP."
            echo "The project structure needs inspection."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Darb-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
